<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Для любими</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
 <!-- Первая кнопка: показывает текст и вторую кнопку -->
    <button class="love-btn" onclick="showText()">Нажми меня лапкой</button>

    <!-- Этот блок скрыт до первого нажатия -->
    <div id="greetingBlock" class="hidden">
        <p class="greeting">Я люблю тибя!</p>
        <!-- Вторая кнопка: возвращает всё обратно -->
        <button class="reset-btn" onclick="resetAll()">Халасо</button>
    </div>

    <script>
        function showText() {
            document.getElementById("greetingBlock").classList.remove("hidden");
        }
        function resetAll() {
            document.getElementById("greetingBlock").classList.add("hidden");
        }
    </script>

</body>
</html>
